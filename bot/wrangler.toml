name = "ai-football-bot"
main = "src/index.js"
compatibility_date = "2023-10-30"

# 23:59 UTC: dispatch the nightly GitHub Actions scrape on time.
# Cloudflare cron fires within seconds; GitHub's own scheduler drifts hours late.
# Render handles live polling 24/7, so this cron only dispatches the scrape and
# never writes to KV (no quota risk).
# Requires secret: wrangler secret put GITHUB_TOKEN   (fine-grained PAT, Actions: write)
[triggers]
crons = ["59 23 * * *"]

# We use KV to store the JSON so the flutter app can fetch it instantly
[[kv_namespaces]]
binding = "SCORES_KV"
id = "ca798cfd487c4155ad736cdc19bc6e51"

# Ensure environment variables are loaded securely
[vars]
SPORTS_API_URL = "https://v3.football.api-sports.io/fixtures?live=all"
