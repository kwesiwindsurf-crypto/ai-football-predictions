name: Scrape Football Matches

on:
  schedule:
    # Every 20 mins during peak match hours (10:00 - 23:00 UTC) = 42 runs/day
    - cron: '*/20 10-23 * * *'
    # Hourly overnight (00:00 - 09:00 UTC) = 10 runs/day
    # Total = 52 runs/day * 30 = ~1,560 mins/month (stays well under the 2,000 monthly limit)
    - cron: '0 0-9 * * *'
  push:
    branches:
      - main
    paths:
      - 'bot/**'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape & Push to Cloudflare KV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Run full scraper
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY || '3d923c01afee89b7b9ae92761979ef56' }}
        run: node scraper.mjs
        working-directory: bot

      - name: Commit updated match history for GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): auto-archive finished matches [skip ci]" && git push)

      - name: Report success
        if: success()
        run: echo "Scrape completed successfully at $(date -u)"

      - name: Report failure
        if: failure()
        run: echo "Scrape FAILED at $(date -u)" && exit 1
