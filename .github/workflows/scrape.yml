name: Scrape Football Matches

on:
  schedule:
    # Run once daily at 23:59 UTC, just before midnight, so the scrape picks
    # up the freshest DraftKings/ESPN prices for the next day's fixtures.
    # Predictions are locked once a match kicks off (odds are erased then),
    # so anything still to play is refreshed with the latest odds.
    - cron: '59 23 * * *'
  push:
    branches:
      - main
    paths:
      - 'bot/**'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape & Push to Cloudflare KV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Run full scraper
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scraper.mjs
        working-directory: bot

      - name: Commit updated match history for GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): auto-archive finished matches [skip ci]" && git push)

      - name: Report success
        if: success()
        run: echo "Scrape completed successfully at $(date -u)"

      - name: Report failure
        if: failure()
        run: echo "Scrape FAILED at $(date -u)" && exit 1
