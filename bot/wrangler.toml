name = "ai-football-bot"
main = "src/index.js"
compatibility_date = "2023-10-30"

# No cron trigger: the nightly scrape is scheduled by GitHub Actions itself
# (`.github/workflows/scrape.yml`, cron '59 23 * * *'). That needs no extra
# token anywhere. GitHub's scheduler can start the job a few hours late; the
# scrape still runs every night.
#
# (The Worker still has dispatchNightlyScrape() in src/index.js. If you ever
# want the scrape to start exactly on time, set the GITHUB_TOKEN secret and
# re-enable: [triggers] crons = ["59 23 * * *"])

# We use KV to store the JSON so the flutter app can fetch it instantly
[[kv_namespaces]]
binding = "SCORES_KV"
id = "ca798cfd487c4155ad736cdc19bc6e51"
